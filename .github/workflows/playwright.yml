name: QA Portfolio Validation
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  validate:
    # The application under test runs in a separate local XAMPP environment.
    # This workflow validates the suite without claiming a remote test result.
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Validate Playwright configuration and test discovery
      run: npx playwright test --list
